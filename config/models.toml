# Model ids and list prices in USD per million tokens, used for every cost number.
# Generation, classification and extraction run on open weights served locally by Ollama (D16); their
# price is the public list price of the same weights on OpenRouter (checked 2026-09-30), so cost
# numbers stay comparable across roles. Only the judge calls a hosted API.
# Any "PIN_ME" left in this file makes config.models() raise.

[providers.gemini]
base_url = "https://generativelanguage.googleapis.com/v1beta/openai/"
key_env = "GEMINI_API_KEY"

[providers.ollama]                 # local model server (runs on the lead's GPU); needs no key
base_url = "http://127.0.0.1:11434/v1"
key_env = ""
load_url = "http://127.0.0.1:11434/api/generate"   # a request with no prompt only loads the model

[roles.small]
provider = "ollama"
model = "gpt-oss:20b"
price_in_per_m = 0.018
price_out_per_m = 0.09
reasoning_effort = "low"

[roles.large]
provider = "ollama"
model = "qwen3.6:35b-a3b"          # mixture of experts, 3B active: a larger model that fits 8 GB VRAM + RAM
price_in_per_m = 0.15
price_out_per_m = 1.0
reasoning_effort = "medium"

[roles.classify]
provider = "ollama"
model = "gpt-oss:20b"
price_in_per_m = 0.018
price_out_per_m = 0.09
reasoning_effort = "low"

[roles.extract]
provider = "ollama"
model = "gpt-oss:20b"
price_in_per_m = 0.018
price_out_per_m = 0.09
reasoning_effort = "low"

[roles.judge]
provider = "ollama"
model = "gemma4:31b"              # D19, D21: Gemma 4 31B (Q4_K_M) on Ollama, a different family from every generator
price_in_per_m = 0.08             # OpenRouter list price of the same weights (checked 2026-09-30)
price_out_per_m = 0.30
json_mode = false                 # judge.parse_scores reads plain, fenced or thought-prefixed JSON
server_error_attempts = 5

[roles.embed]
provider = "ollama"
model = "nomic-embed-text"         # nomic-embed-text v1.5 on a local GPU (Ollama), 768 dims; replaced
price_in_per_m = 0.0               # gemini-embedding-001 on 2026-09-30: its free tier allowed
price_out_per_m = 0.0              # 1,000 texts a day. Local compute is recorded as $0.
dims = 768
document_prefix = "search_document: "
query_prefix = "search_query: "

[limits]
max_llm_calls_per_query = 4
