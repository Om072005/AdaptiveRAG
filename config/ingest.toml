# Chunking (M2), extraction and entity resolution (M3) settings.

[chunk.fixed]
n_words = 64
overlap = 16

[chunk.sentence]
max_words = 96

[chunk.semantic]
percentile = 90

[extract]
chunks_per_call = 4
min_confidence = 0.5
max_tokens = 4096   # output cap for one extraction call (4 passages of triples plus thinking)
fuzzy_ratio = 0.9  # validation: an entity name matches the chunk text at this ratio or above

[resolve]
name_sim = 0.92
embed_sim = 0.88
embed_merge = false   # D18: 100 labelled merges, embedding rule precision 0.125 (6 of 48), name rule 0.96
person_needs_shared_neighbor = true
