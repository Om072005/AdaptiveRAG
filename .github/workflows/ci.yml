name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install locked dependencies
        run: uv sync --locked

      # the same command every member runs before shipping; network tests are skipped
      - name: Lint, types, unit tests, framework guard, page check
        run: bash scripts/check.sh
