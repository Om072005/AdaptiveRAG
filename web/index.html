<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AdaptiveRAG: every question gets the search it needs</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="AdaptiveRAG reads each question, picks vector search, a knowledge graph or both, and answers with sources you can check. Open source, measured on HotpotQA." />
    <script>
      // the saved theme, applied before the first paint; without one the system setting decides
      try {
        var saved = localStorage.getItem('theme')
        if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
